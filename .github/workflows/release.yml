name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            rust_targets: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.rust_targets || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Clauwitch ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            Clauwitch for Windows, macOS and Linux.

            - One sign-in per Claude account; sessions are kept locally.
            - Turkish and English interface.
            - Follows Claude's light or dark theme.

            macOS builds are unsigned: right-click → Open on first launch.
            Linux needs a community Claude Desktop build that provides `claude-desktop` on PATH.

            This is an unofficial tool. Claude and Anthropic are trademarks of Anthropic PBC.
