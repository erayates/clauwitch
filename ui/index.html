<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Clauwitch</title>
  <link rel="icon" href="app-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <symbol id="icon-swap" viewBox="0 0 24 24">
      <path d="M4 9h15M15.5 5.5 19 9l-3.5 3.5M20 15H5M8.5 11.5 5 15l3.5 3.5"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.25"/>
      <ellipse cx="12" cy="12" rx="3.4" ry="8.25"/>
      <path d="M4.25 12h15.5"/>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m7 10 5 5 5-5"/>
    </symbol>
    <symbol id="icon-more" viewBox="0 0 24 24">
      <path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="2.8"/>
    </symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24">
      <path d="M4 7.5h5l2 2.2h9v9.3H4z"/>
    </symbol>
    <symbol id="icon-pencil" viewBox="0 0 24 24">
      <path d="m5.5 18.5 1-4.2L16.8 4l3.2 3.2-10.3 10.3zM14.8 5.9l3.3 3.3"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M5 7h14M9.5 7V4.8h5V7M7.2 7l.8 12h8l.8-12M10.3 10v6M13.7 10v6"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="m7 7 10 10M17 7 7 17"/>
    </symbol>
    <symbol id="icon-open" viewBox="0 0 24 24">
      <path d="M14 5h5v5M19 5l-7 7"/>
      <path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>
    </symbol>
    <symbol id="icon-bring" viewBox="0 0 24 24">
      <rect x="5" y="9" width="14" height="10" rx="2"/>
      <path d="M12 8V3M9.5 5.5 12 3l2.5 2.5"/>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="m10 7 5 5-5 5"/>
    </symbol>
    <symbol id="icon-power" viewBox="0 0 24 24">
      <path d="M12 4v8"/>
      <path d="M8.2 6.3a8 8 0 1 0 7.6 0"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12.5 4.5 4.5L19 7.5"/>
    </symbol>
    <symbol id="icon-window-minimize" viewBox="0 0 24 24">
      <path d="M6 12h12"/>
    </symbol>
    <symbol id="icon-window-maximize" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
    </symbol>
    <symbol id="icon-window-restore" viewBox="0 0 24 24">
      <rect x="8" y="5" width="11" height="11" rx="2"/>
      <path d="M5 9v8a2 2 0 0 0 2 2h8"/>
    </symbol>
  </svg>

  <div class="app" id="app">
    <div class="progress" id="progress" hidden></div>

    <div class="titlebar">
      <div class="titlebar-brand">
        <img class="brand-tile" src="app-icon.png" alt="">
        <span>Clauwitch</span>
      </div>
      <div class="titlebar-drag-layer" id="titlebarDragLayer" data-tauri-drag-region></div>
      <div class="window-controls" id="windowControls">
        <button class="window-control" id="windowMinimize" type="button" aria-label="Minimize window" title="Minimize window">
          <svg class="icon"><use href="#icon-window-minimize"/></svg>
        </button>
        <button class="window-control" id="windowMaximize" type="button" aria-label="Maximize window" title="Maximize window">
          <svg class="icon"><use id="windowMaximizeIcon" href="#icon-window-maximize"/></svg>
        </button>
        <button class="window-control window-close" id="windowClose" type="button" aria-label="Close window" title="Close window">
          <svg class="icon"><use href="#icon-close"/></svg>
        </button>
      </div>
    </div>

    <header class="header">
      <div class="header-copy">
        <h1 class="header-title" id="headerTitle">Claude accounts</h1>
        <p class="header-subtitle" id="headerSubtitle">Each account is kept as its own session. Switching reopens Claude with your saved sign-in.</p>
      </div>
      <button class="btn btn-secondary btn-compact language-button" id="languageButton" type="button" aria-haspopup="menu" aria-expanded="false">
        <svg class="icon"><use href="#icon-globe"/></svg>
        <span id="languageLabel">English</span>
        <svg class="icon icon-chevron"><use href="#icon-chevron-down"/></svg>
      </button>
    </header>

    <div class="banner" id="banner" hidden></div>

    <main class="content">
      <section class="card" aria-label="Claude accounts">
        <div class="account-list" id="accountList" role="listbox" aria-label="Accounts"></div>
        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-mark" aria-hidden="true">
            <img src="app-icon.png" alt="">
          </div>
          <h2 id="emptyTitle">No other accounts yet</h2>
          <p id="emptyBody">Use “Add account” to add another Claude account. Each account signs in once and its session is saved.</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p class="status-text" id="statusText" aria-live="polite"></p>
      <div class="footer-actions">
        <button class="btn btn-secondary" id="addButton" type="button">
          <svg class="icon"><use href="#icon-plus"/></svg>
          <span id="addLabel">Add account</span>
        </button>
        <button class="btn btn-primary primary-action" id="primaryButton" type="button">
          <svg class="icon"><use id="primaryIcon" href="#icon-swap"/></svg>
          <span id="primaryLabel">Switch</span>
        </button>
      </div>
    </footer>

    <div class="resize-handle resize-w" data-resize="West"></div>
    <div class="resize-handle resize-e" data-resize="East"></div>
    <div class="resize-handle resize-s" data-resize="South"></div>
    <div class="resize-handle resize-sw" data-resize="SouthWest"></div>
    <div class="resize-handle resize-se" data-resize="SouthEast"></div>

    <div class="modal-layer" id="modalLayer" hidden></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
